<script>
(function(){try{
var q=location.search,r=document.referrer||"";
if(!(/[?&]source=twa\b/.test(q)||r.indexOf("android-app://")===0))return;
if(sessionStorage.getItem("srd-intro"))return;sessionStorage.setItem("srd-intro","1");
var rm=matchMedia("(prefers-reduced-motion: reduce)").matches;
var st=document.createElement("style");
st.textContent="#srdi{position:fixed;inset:0;z-index:2147483647;background:#0e0d0c;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#fff;transition:opacity .45s ease;-webkit-tap-highlight-color:transparent}"+
"#srdi.out{opacity:0;pointer-events:none}"+
"#srdi .rg{position:relative;width:132px;height:132px;border-radius:50%;display:grid;place-items:center;animation:si-in .7s cubic-bezier(.2,.9,.3,1.3) both}"+
"#srdi .rg:before{content:'';position:absolute;inset:-6px;border-radius:50%;background:conic-gradient(from 0deg,#0b6cf0,#5aa2ff,#0b6cf0 60%,transparent 75%,#0b6cf0);animation:si-spin 1.6s linear infinite;-webkit-mask:radial-gradient(circle,transparent 64px,#000 65px);mask:radial-gradient(circle,transparent 64px,#000 65px)}"+
"#srdi .rg:after{content:'';position:absolute;inset:-6px;border-radius:50%;box-shadow:0 0 0 0 rgba(11,108,240,.55);animation:si-pulse 1.4s ease-out .5s infinite}"+
"#srdi img{width:116px;height:116px;border-radius:50%;object-fit:cover;box-shadow:0 0 40px rgba(11,108,240,.45)}"+
"#srdi h1{margin:26px 0 4px;font-size:30px;font-weight:800;letter-spacing:.5px;overflow:hidden}"+
"#srdi h1 span{display:inline-block;opacity:0;transform:translateY(100%);animation:si-up .5s ease forwards}"+
"#srdi p{margin:0;font-size:13px;letter-spacing:4px;text-transform:uppercase;color:#7fb2ff;opacity:0;animation:si-fade .6s ease 1.05s forwards}"+
"#srdi .eq{display:flex;gap:5px;align-items:flex-end;height:28px;margin-top:22px;opacity:0;animation:si-fade .4s ease 1.2s forwards}"+
"#srdi .eq i{width:5px;border-radius:3px;background:linear-gradient(#5aa2ff,#0b6cf0);height:30%;animation:si-eq .9s ease-in-out infinite alternate}"+
"#srdi small{position:absolute;bottom:28px;font-size:11px;color:#777;letter-spacing:1px}"+
"@keyframes si-in{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}"+
"@keyframes si-spin{to{transform:rotate(360deg)}}"+
"@keyframes si-pulse{0%{box-shadow:0 0 0 0 rgba(11,108,240,.55)}100%{box-shadow:0 0 0 26px rgba(11,108,240,0)}}"+
"@keyframes si-up{to{opacity:1;transform:none}}@keyframes si-fade{to{opacity:1}}"+
"@keyframes si-eq{0%{height:20%}100%{height:100%}}"+
"#srdi.rm *,#srdi.rm *:before,#srdi.rm *:after{animation:none!important;opacity:1!important;transform:none!important}";
document.head.appendChild(st);
var d=document.createElement("div");d.id="srdi";if(rm)d.className="rm";d.setAttribute("aria-hidden","true");
var t="SRD Masum",h="";for(var i=0;i<t.length;i++)h+="<span style='animation-delay:"+(.45+i*.05).toFixed(2)+"s'>"+(t[i]==" "?"&nbsp;":t[i])+"</span>";
var eq="";for(var j=0;j<9;j++)eq+="<i style='animation-delay:"+(j*0.11%0.6).toFixed(2)+"s;animation-duration:"+(.6+(j*37%5)/10).toFixed(2)+"s'></i>";
d.innerHTML="<div class=rg><img src='/images/avatar.webp' alt=''></div><h1>"+h+"</h1><p>Music Platform</p><div class=eq>"+eq+"</div><small>Tap to skip</small>";
var done=0;function end(){if(done)return;done=1;d.className+=" out";setTimeout(function(){d.remove();st.remove()},500)}
d.addEventListener("click",end);
(document.body||document.documentElement).appendChild(d);
setTimeout(end,rm?700:2300);
}catch(e){}})();
</script>
